<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Vincular Dispositivo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { min-height: 100vh; padding: 24px; text-align: center; background: #f8fafc; color: #0f172a; }
    h1 { font-size: 15px; font-weight: 600; color: #0f172a; margin-bottom: 4px; }
    p.sub { font-size: 12px; color: #64748b; margin-bottom: 18px; line-height: 1.5; }
    .code-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px 16px; margin-bottom: 14px; }
    .code { font-size: 38px; font-weight: 700; letter-spacing: 0.22em; font-family: ui-monospace, Consolas, monospace; color: #1d4ed8; }
    .code.placeholder { color: #94a3b8; font-size: 14px; letter-spacing: normal; font-weight: 500; }
    .status { font-size: 12px; color: #64748b; margin-top: 10px; min-height: 16px; }
    .status.success { color: #047857; }
    .status.error { color: #b91c1c; }
    button.primary { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 36px; margin-top: 6px; padding: 0 14px; border: 1px solid #2563eb; border-radius: 6px; background: #2563eb; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; font-family: inherit; }
    button.primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    button.primary:active { transform: scale(.98); }
    button:disabled { opacity: .5; pointer-events: none; }
    .terminal-uid { font-size: 10px; color: #94a3b8; margin-top: 16px; word-break: break-all; }
    .paired-box { display: none; background: #ecfdf5; border: 1px solid #d1fae5; border-radius: 8px; padding: 18px; margin-bottom: 14px; }
    .paired-box .name { font-size: 17px; font-weight: 700; color: #047857; }
    .paired-box .hint { font-size: 11px; color: #64748b; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Vincular Dispositivo</h1>
  <p class="sub">Gere um código aqui e digite em Configurações → Vincular Dispositivos no painel web, dando um nome pra este terminal (ex: "Escritório", "Caixa 1").</p>

  <div class="paired-box" id="pairedBox">
    <div class="name" id="pairedName"></div>
    <div class="hint">Este terminal já está vinculado. Feche esta janela.</div>
  </div>

  <div class="code-box" id="codeBox">
    <div class="code placeholder" id="codeText">Clique em "Gerar Código"</div>
  </div>
  <div class="status" id="status"></div>

  <button class="primary" id="genBtn" onclick="requestCode()">Gerar Código</button>
  <div class="terminal-uid" id="terminalUid"></div>

  <script>
    let pollTimer = null;

    function setStatus(text, type) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.className = `status ${type || ""}`;
    }

    function showPaired(terminal) {
      document.getElementById("pairedBox").style.display = "block";
      document.getElementById("pairedName").textContent = terminal.name;
      document.getElementById("codeBox").style.display = "none";
      document.getElementById("genBtn").style.display = "none";
      setStatus("", "");
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    async function requestCode() {
      const btn = document.getElementById("genBtn");
      btn.disabled = true;
      setStatus("Gerando código...", "");
      const result = await window.boxsysDesktop.requestPairingCode();
      btn.disabled = false;
      if (!result.ok) {
        setStatus(result.error || "Não foi possível gerar o código.", "error");
        return;
      }
      const codeEl = document.getElementById("codeText");
      codeEl.textContent = result.code;
      codeEl.classList.remove("placeholder");
      setStatus("Aguardando vinculação no painel web...", "");
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(checkStatus, 3000);
    }

    async function checkStatus() {
      const result = await window.boxsysDesktop.checkPairingStatus();
      if (result.paired && result.terminal) {
        showPaired(result.terminal);
      } else if (result.expired) {
        setStatus("Código expirado — gere um novo.", "error");
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    (async function init() {
      const state = await window.boxsysDesktop.getPairingState();
      document.getElementById("terminalUid").textContent = state.terminalUid;
      if (!state.hasServer) {
        setStatus("Configure o endereço da loja antes de vincular.", "error");
        document.getElementById("genBtn").disabled = true;
        return;
      }
      if (state.paired) {
        showPaired(state.paired);
      }
    })();
  </script>
</body>
</html>

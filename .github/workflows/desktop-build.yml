name: Build Desktop App

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # --ignore-scripts: nenhum módulo nativo do projeto precisa de compilação (serialport
        # tem prebuilds prontos por plataforma) — sem isso, o npm às vezes ignora
        # "gypfile": false e tenta rodar node-gyp rebuild de qualquer jeito, o que trava
        # (sem Visual Studio Build Tools) ou falha (bug conhecido do npm).
        run: npm install --ignore-scripts

      - name: Download better-sqlite3 prebuild for Electron ABI
        # better-sqlite3 usa ABI nativo do runtime (Node ABI 127 ≠ Electron ABI 130) —
        # um binário baixado/compilado para o Node do CI quebra silenciosamente ao
        # carregar dentro do Electron empacotado (crash "napi_get_last_error_info").
        # --ignore-scripts acima também pulou o "install" script deste pacote (que
        # baixaria o prebuild certo sozinho) — busca aqui, explicitamente, apontando
        # pro runtime/versão real do Electron usado no app.
        shell: bash
        run: |
          cd node_modules/better-sqlite3
          ELECTRON_VERSION=$(node -e "console.log(require('../electron/package.json').version)")
          echo "Electron version: $ELECTRON_VERSION"
          npx prebuild-install --runtime=electron --target=$ELECTRON_VERSION

      - name: Build and publish installers
        # --publish always: publica direto no GitHub Release da tag (cria se não existir),
        # incluindo latest.yml/latest-mac.yml/latest-linux.yml que o electron-updater
        # (autoUpdater) consulta para saber se há versão nova.
        run: npx electron-builder ${{ matrix.args }} --publish always
        if: startsWith(github.ref, 'refs/tags/desktop-v')

      - name: Build only (no publish)
        run: npx electron-builder ${{ matrix.args }} --publish never
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}

      - name: Upload artifacts (manual runs / PRs)
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: boxsys-pdv-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
          if-no-files-found: error

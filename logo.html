<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store BoxSys - Logo</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #09161f; display: flex; align-items: center; justify-content: center; }
  .logo { width: min(92vw, 667px); height: auto; display: block; overflow: visible; }

  /* As peças chegam e se encaixam no logo final, sem abrir a caixa. */
  .logo-mark .piece {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
    animation: encaixar-peca 680ms cubic-bezier(.22, .9, .34, 1) both;
  }

  .logo-mark .piece-top-left  { animation-delay: 0ms;   --x: -24px; --y: -34px; --r: -8deg; }
  .logo-mark .piece-top-right { animation-delay: 70ms;  --x: 24px;  --y: -30px; --r: 8deg; }
  .logo-mark .piece-left      { animation-delay: 140ms; --x: -42px; --y: 3px;   --r: -6deg; }
  .logo-mark .piece-right     { animation-delay: 210ms; --x: 42px;  --y: 3px;   --r: 6deg; }
  .logo-mark .piece-bottom-left  { animation-delay: 280ms; --x: -18px; --y: 28px; --r: -3deg; }
  .logo-mark .piece-bottom-right { animation-delay: 350ms; --x: 18px;  --y: 28px; --r: 3deg; }

  .word-store,
  .word-boxsys {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
  }

  .word-store { animation: entrar-store 560ms cubic-bezier(.22, .9, .34, 1) 570ms both; }
  .word-boxsys { animation: entrar-boxsys 560ms cubic-bezier(.22, .9, .34, 1) 670ms both; }

  @keyframes encaixar-peca {
    0% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(.82); }
    72% { opacity: 1; transform: translate(-2px, 1px) rotate(0) scale(1.025); }
    100% { opacity: 1; transform: translate(0) rotate(0) scale(1); }
  }

  @keyframes entrar-store {
    from { opacity: 0; transform: translateX(-28px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes entrar-boxsys {
    from { opacity: 0; transform: translateX(28px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-mark .piece, .word-store, .word-boxsys { animation: none; opacity: 1; }
  }
</style>
</head>
